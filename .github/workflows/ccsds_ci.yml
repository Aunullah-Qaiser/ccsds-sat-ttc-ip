name: CCSDS-SAT-TTC-IP Full Verification & Synthesis CI (v2.26.9)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify-ccsds-ip:
    name: Static SV Audit (38 Files), Verilator Lint, C++20 Co-Sim & Stage 9/10 Sign-Off
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (g++20, Verilator, Icarus Verilog & Python Packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ verilator iverilog
          python3 -m pip install --upgrade pip
          pip install cryptography matplotlib numpy spacepackets

      - name: Gate 1 — Static IEEE 1800-2017 AST, Hierarchy & Timescale Audit (38 .sv files)
        run: |
          python3 scripts/sv_rtl_audit.py

      - name: Gate 2 — Verilator Full-Hierarchy Synthesizable RTL Lint
        run: |
          verilator --lint-only -Wall --Wno-fatal \
            -Wno-BLKSEQ -Wno-WIDTH -Wno-CASEINCOMPLETE -Wno-UNOPTFLAT \
            -Wno-DECLFILENAME -Wno-UNUSED -Wno-UNDRIVEN -Wno-VARHIDDEN -Wno-PINCONNECTEMPTY \
            -Wno-TIMESCALEMOD \
            --top-module ccsds_sat_ttc_top \
            -Irtl \
            rtl/ccsds_pkg.sv \
            $(ls rtl/*.sv | grep -v ccsds_pkg.sv | grep -v ccsds_channel_impairment_model.sv)

      - name: Gate 3 — Stages 1–8 C++20 Hardware Co-Simulation, VCD Waveform Matcher & Channel Sweep
        run: |
          python3 scripts/run_regression_suite.py --stage 8
          python3 scripts/vcd_waveform_matcher.py
          python3 scripts/run_channel_ber_sweep.py

      - name: Gate 4 — Stage 9 External Reference Vector Generation (spacepackets-py & NIST FIPS-197 AES-128)
        run: |
          python3 scripts/run_external_ref_check.py --generate

      - name: Upload VCD Waveforms, Channel Sweep Plots & JSON Reports
        uses: actions/upload-artifact@v4
        with:
          name: ccsds-verification-artifacts
          path: |
            reports/*.json
            reports/*.csv
            reports/*.png
            sim_waves/*.vcd
            sim_waves/*.hex
            stage*_verification_report.json
